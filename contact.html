<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>North Star Bakery - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/bakery-logo.png" alt="North Star Bakery logo, a star over a wheat stalk">
        <h1>Contact Us</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Visit Us</h2>
            <p>214 Maple Street. Open Tuesday through Sunday, 7:00 a.m. to 6:00 p.m.</p>
        </section>
        <section>
            <h2>Pre Order and Inquiry Form</h2>
            <form id="inquiry-form" action="#" method="post">
                <fieldset>
                    <legend>Pre Order or General Inquiry</legend>
 
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                    <span id="name-error" style="color: red; font-size: 0.9em; font-weight: bold;"></span>
                    <br>
 
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <span id="email-error" style="color: red; font-size: 0.9em; font-weight: bold;"></span>
                    <br>
 
                    <label for="pickup-date">Pickup Date:</label>
                    <input type="date" id="pickup-date" name="pickup-date">
                    <br>
 
                    <label for="request-type">Request Type:</label>
                    <select id="request-type" name="request-type" required>
                        <option value="">Select one</option>
                        <option value="pre-order">Pre Order</option>
                        <option value="general-question">General Question</option>
                    </select>
                    <br>
 
                    <label for="item-details">Item Details:</label>
                    <textarea id="item-details" name="item-details" rows="4" cols="30" maxlength="500"></textarea>
                    <br>
 
                    <label for="allergy-notes">Allergy Notes (if applicable):</label>
                    <textarea id="allergy-notes" name="allergy-notes" rows="2" cols="30" maxlength="200"></textarea>
                    <br>
 
                    <button type="submit">Send Request</button>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 North Star Bakery. 214 Maple Street.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
